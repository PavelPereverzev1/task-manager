<div class="card shadow-sm border-0 rounded-3 overflow-hidden" id="project-{{ project.id }}">
    <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between py-3">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-calendar-event fs-5"></i>
            <h5 class="mb-0 fw-semibold">{{ project.title }}</h5>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-link text-white p-0 border-0 fs-5"
        title="Edit Project"
        hx-get="{% url 'project-update' project.id %}"
        hx-target="#modal-content"
        hx-swap="innerHTML"
        hx-on:htmx:after-on-load="bootstrap.Modal.getOrCreateInstance(document.getElementById('projectModal')).show()">
          <i class="bi bi-pencil"></i>
           </button>
            <button class="btn btn-link text-white p-0 border-0 fs-5"
                    hx-post="{% url 'project-delete' project.id %}"
                    hx-target="#project-{{ project.id }}"
                    hx-swap="outerHTML">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>


    <div class="bg-light p-3 border-bottom">
        <form hx-post="#" hx-target="#tasks-list-{{ project.id }}" hx-swap="beforeend">
            {% csrf_token %}
            <div class="input-group">
                <span class="input-group-text bg-white text-success border-end-0 fs-5"><i class="bi bi-plus-lg"></i></span>
                <input type="text" name="text" class="form-control border-start-0 ps-0" placeholder="Start typing here to create a task..." required>
                <button class="btn btn-success fw-semibold px-4" type="submit">Add Task</button>
            </div>
        </form>
    </div>

    <div class="list-group list-group-flush" id="tasks-list-{{ project.id }}">
        {% for task in project.tasks.all %}
            <div class="list-group-item d-flex align-items-center justify-content-between py-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="task-{{ task.id }}">
                    <label class="form-check-label ms-2" for="task-{{ task.id }}">{{ task.title }}</label>
                </div>
                <div class="btn-group gap-2">
                    <button class="btn btn-sm btn-link text-secondary p-0"><i class="bi bi-arrow-down-up"></i></button>
                    <button class="btn btn-sm btn-link text-secondary p-0"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-link text-secondary p-0"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        {% empty %}
            <div class="text-center text-muted py-3 small">No tasks yet</div>
        {% endfor %}
    </div>
</div>
