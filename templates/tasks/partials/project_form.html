<form hx-post="{% url 'project-create' %}"
      hx-target="#projects-list"
      hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful) { this.reset(); bootstrap.Modal.getInstance(document.getElementById('addProjectModal')).hide(); }">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label for="id_title" class="form-label fw-bold">List Title</label>
            {{ form.title }}
            {% if form.title.errors %}
                <div class="text-danger small mt-1">
                    {{ form.title.errors|join:", " }}
                </div>
            {% endif %}
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Create List</button>
    </div>
</form>
