<div class="modal-header bg-primary text-white">
  <h5 class="modal-title">
    {% if project %}Edit TODO List{% else %}Create New TODO List{% endif %}
  </h5>
  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<form hx-post="{% if project %}{% url 'project-update' project.id %}{% else %}{% url 'project-create' %}{% endif %}"
      {% if project %}
        hx-target="#project-{{ project.id }}"
        hx-swap="outerHTML"
      {% else %}
        hx-target="#projects-list"
        hx-swap="afterbegin"
      {% endif %}
      hx-target-error="#modal-content"
      hx-on:htmx:after-request="if (event.detail.xhr.status === 200 || event.detail.xhr.status === 201) {
                                const modalEl = document.getElementById('projectModal');
                                const modal = bootstrap.Modal.getInstance(modalEl);
                                if (modal) modal.hide();
                                }">
  {% csrf_token %}
  <div class="modal-body">
    <div class="mb-3">
      <label for="id_title" class="form-label fw-bold">List Name</label>
      <input type="text"
             name="title"
             id="id_title"
             value="{{ form.title.value|default:'' }}"
             class="form-control {% if form.title.errors %}is-invalid{% endif %}"
             placeholder="Enter list name..."
             maxlength="255"
             required
             oninput="this.value = this.value.replace(/^\s+/g, '')">

      {% if form.title.errors %}
        <div class="invalid-feedback d-block">
          {{ form.title.errors|join:", " }}
        </div>
      {% endif %}
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">
      {% if project %}Save Changes{% else %}Create List{% endif %}
    </button>
  </div>
</form>
