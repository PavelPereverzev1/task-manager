<div class="list-group-item d-flex align-items-center justify-content-between py-3" id="task-{{ task.id }}">
    <div class="d-flex align-items-center gap-2">
        <input class="form-check-input mt-0"
               type="checkbox"
               id="task-check-{{ task.id }}"
               {% if task.is_completed %}checked{% endif %}
               hx-post="{% url 'task-toggle' task.id %}"
               hx-target="#task-{{ task.id }}"
               hx-swap="outerHTML">

        <label class="form-check-label mb-0 {% if task.is_completed %}text-decoration-line-through text-muted{% endif %}"
               for="task-check-{{ task.id }}">
            {{ task.title }}
        </label>

        {% if task.deadline %}
            <span class="badge bg-light text-dark border ms-2">
                <i class="bi bi-calendar3 me-1"></i>{{ task.deadline|date:"Y-m-d" }}
            </span>
        {% endif %}

        {% if task.priority == 3 %}
            <span class="badge bg-danger">High</span>
        {% elif task.priority == 1 %}
            <span class="badge bg-secondary">Low</span>
        {% endif %}
    </div>

    <div class="btn-group gap-2">
        <button class="btn btn-sm btn-link text-secondary p-0"
                title="Edit Task"
                hx-get="{% url 'task-update' task.id %}"
                hx-target="#modal-content"
                hx-swap="innerHTML"
                hx-on:htmx:after-on-load="bootstrap.Modal.getOrCreateInstance(document.getElementById('projectModal')).show()">
            <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-link text-danger p-0"
                title="Delete Task"
                hx-post="{% url 'task-delete' task.id %}"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML">
            <i class="bi bi-trash"></i>
        </button>
    </div>
</div>
